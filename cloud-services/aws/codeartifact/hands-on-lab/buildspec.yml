version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
  pre_build:
    commands:
      - echo "Logging in to Codeartifact repository $CA_REPO in domain $CA_DOMAIN"
      - aws codeartifact login --tool npm --domain "$CA_DOMAIN" --domain-owner "$CA_DOMAIN_OWNER" --repository "$CA_REPO" --region "$AWS_REGION_ENV"
  build:
    commands:
      - echo "Creating package.json..."
      - |
        cat > package.json <<'EOF'
        {
          "name": "codeartifact-test-package",
          "version": "1.0.0",
          "description": "Simple npm package for CodeArtifact testing",
          "main": "index.js",
          "scripts": {
            "start": "node index.js",
            "test": "node test.js"
          },
          "dependencies": {
            "axios": "^1.11.0",
            "lodash": "^4.17.21",
            "uuid": "^11.1.0"
          }
        }
        EOF

      - echo "Installing dependencies..."
      - npm install

  post_build:
    commands:
      - echo "Build finished. Dependency was resolved through Codeartifact repository $CA_REPO."